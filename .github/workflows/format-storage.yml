name: One-time storage rustfmt

on:
  push:
    branches: [feat/capture-storage]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/capture-storage
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply storage fixes
        shell: pwsh
        run: |
          $path = "src-tauri/src/storage.rs"
          $content = Get-Content $path -Raw
          $content = $content.Replace(
            "enforce_disk_quota(&connection, DEFAULT_DISK_QUOTA_BYTES)?;",
            "enforce_disk_quota(&mut connection, DEFAULT_DISK_QUOTA_BYTES)?;"
          )
          Set-Content -Path $path -Value $content -NoNewline
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit fixes
        shell: pwsh
        run: |
          if (git status --porcelain) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src-tauri
            git commit -m "fix(storage): pass mutable database connection"
            git push origin HEAD:feat/capture-storage
          }
