name: One-time flow rustfmt

on:
  push:
    branches: [feat/flow-process-view]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/flow-process-view
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix directional flow fixture and format
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("src-tauri/src/flow.rs")
          content = path.read_text(encoding="utf-8")
          content = content.replace(
              'source: "10.0.0.2".to_string(),',
              'source: if inbound { "1.1.1.1" } else { "10.0.0.2" }.to_string(),',
          )
          content = content.replace(
              'destination: "1.1.1.1".to_string(),',
              'destination: if inbound { "10.0.0.2" } else { "1.1.1.1" }.to_string(),',
          )
          content = content.replace(
              'source_port: Some(50_000),',
              'source_port: Some(if inbound { 443 } else { 50_000 }),',
          )
          content = content.replace(
              'destination_port: Some(443),',
              'destination_port: Some(if inbound { 50_000 } else { 443 }),',
          )
          path.write_text(content, encoding="utf-8")
          '@ | python -
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit formatting
        shell: pwsh
        run: |
          if (git status --porcelain) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src-tauri
            git commit -m "test(flow): fix bidirectional fixture endpoints"
            git push origin HEAD:feat/flow-process-view
          }
