name: Bug report
description: 报告可复现的功能、抓包或界面问题
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        请先移除日志、截图和抓包文件中的 Cookie、Token、内网地址与个人信息。
  - type: input
    id: version
    attributes:
      label: PacketLens 版本或提交
      placeholder: v0.1.0 / commit SHA
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: input
    id: npcap
    attributes:
      label: Npcap 版本
      placeholder: 例如 1.x
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 选择网卡...
        2. 使用过滤器...
        3. 点击开始捕获...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与错误日志
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我已经移除真实 Token、Cookie、密码和敏感 payload
          required: true
